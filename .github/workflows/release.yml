# On a version tag (v0.1.0): build self-contained, test, make the installer with Inno Setup, write SHA256SUMS.txt,
# and open a DRAFT release with both. Nothing is published until a person checks the draft and presses "Publish".
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v (for a test build; no release is created)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Not a version: $v" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup --exact --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
        continue-on-error: true

      - name: Find Inno Setup
        shell: pwsh
        run: |
          $iscc = @("$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version '${{ steps.version.outputs.value }}' -Repository '${{ github.repository }}' -Iscc $env:ISCC

      - name: Keep the files of this run
        uses: actions/upload-artifact@v4
        with:
          name: OptLife-${{ steps.version.outputs.value }}
          path: |
            artifacts/OptLife-Setup-*.exe
            artifacts/SHA256SUMS.txt

      - name: Draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.value }}'
          # The notes of this version from CHANGELOG.md: the lines under "## [<version>]" up to the next "## ".
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]" | Select-Object -First 1).LineNumber
          $notes = if ($start) { ($lines[$start..($lines.Count - 1)] | ForEach-Object -Begin { $stop = $false } -Process { if ($_ -match '^## ') { $stop = $true }; if (-not $stop) { $_ } }) -join "`n" } else { "OptLife $v" }
          $notes += "`n`n**SHA-256** (check it before running the installer):`n```````n$(Get-Content artifacts/SHA256SUMS.txt)`n``````"
          Set-Content notes.md $notes -Encoding utf8
          gh release create "v$v" artifacts/OptLife-Setup-$v.exe artifacts/SHA256SUMS.txt --draft --title "OptLife $v" --notes-file notes.md
